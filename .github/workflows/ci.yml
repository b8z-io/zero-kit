# zero-kit's own CI: the reusable App workflow (app.yml), run on the example App, hello. Its headless checks are
# zero-kit's checks (tests/run.sh); on main it publishes hello as the "latest" release, for trying on the device.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# One build at a time per branch: overlapping runs would race to replace the "latest" release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hello:
    uses: ./.github/workflows/app.yml
    with:
      app: hello
      title: Hello Zero
      dir: examples/hello
      kit: .
